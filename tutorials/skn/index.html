<script>
'use strict';
const HIGHLIGHT_MS=3500,SCROLL_MS=Math.round(500+3000/1.1+200);
const PLAN=JSON.parse(document.getElementById('screen-plan').textContent);

let index=0,history=[],phase=0,audio=null,timer=null,writingReady=true,pending=false,lastBackground=null,lessonTimer=null,tickTimer=null,lessonElapsed=0,reviewElapsed=0,recording=false;
function clearSceneTimers(){clearTimeout(timer);clearTimeout(lessonTimer);clearTimeout(tickTimer);$('nextDay').hidden=true;}
const seen=new Set();let started=false,completed=false;
function current(){return PLAN[index];}
function visual(s=current()){return s.phases?{...s,...s.phases[phase]}:s;}
function nextTarget(s=current(),choice){return choice||s.next;}
function track(s){
 const send=(name,params)=>{try{params.tutorial='skn-explore-v4';if(parent!==window)parent.postMessage({__kumonGA:1,name,params},'*');else if(window.gtag)window.gtag('event',name,params);}catch(e){}};
 if(!['intro','title'].includes(s.id)&&!started){started=true;send('tutorial_start',{});}
 if(s.id==='end'&&!completed){completed=true;send('tutorial_complete',{});}
 else if(!['intro','title'].includes(s.id)&&!seen.has(s.id)){seen.add(s.id);send('tutorial_step',{step_id:s.id,step_no:index});}
}
function go(id,back=false){
 const target=PLAN.findIndex(s=>s.id===id);if(target<0)return;
 if(audio){audio.pause();audio=null;}recording=false;clearSceneTimers();
 if(id==='S04')lessonElapsed=0;if(id==='S07')reviewElapsed=0;
 if(!back)history.push(index);index=target;phase=0;pending=false;track(current());render();
}
function advance(){
 const s=current();if(!writingReady||pending)return;
 if(s.type==='choice'){ $('status').textContent='살펴보기 또는 건너뛰기를 선택해주세요.';return; }
 if(s.type==='end'){restart();return;}
 if(s.id==='S06a'){pending=true;$('nextButton').disabled=true;const card=$('nextDay');card.hidden=false;card.className='next-day';lessonTimer=setTimeout(()=>{go(s.next);card.hidden=false;card.className='next-day leaving';lessonTimer=setTimeout(()=>{card.hidden=true;},600);},2100);fade($('speechWrap'),[{opacity:1},{opacity:0}],450);return;}
 if(s.phases&&phase<s.phases.length-1){phase++;render();return;}
 go(nextTarget(s));
}
function previous(){if(audio){audio.pause();audio=null;}pending=false;clearSceneTimers();if(current().phases&&phase>0){phase--;render();return;}if(history.length){index=history.pop();phase=0;render();}}
function restart(){if(audio)audio.pause();clearSceneTimers();pending=false;lessonElapsed=0;reviewElapsed=0;index=0;history=[];phase=0;started=false;completed=false;seen.clear();render();}
function activate(){
 const s=current();if(s.id==='S14'){if(!recording){recording=true;render();return;}recording=false;go(s.next);return;}if(pending)return;if(s.id==='S12'&&phase===1){pending=true;$('nextButton').disabled=true;$('status').textContent='음원 다운로드·재생 예시';timer=setTimeout(()=>go(s.next),700);return;}
 if(s.audio){
  if(!s.audioSrc){$('status').textContent='음원 파일 준비 중입니다. 다음으로 계속 확인할 수 있어요.';return;}
  if(audio)audio.pause();audio=new Audio('assets/'+s.audioSrc);audio.play().then(()=>$('status').textContent='음원 재생 중').catch(()=>$('status').textContent='음원을 재생할 수 없습니다. 다음으로 계속 확인할 수 있어요.');return;
 }
 advance();
}
function setRect(el,b){Object.assign(el.style,{left:b.l+'%',top:b.t+'%',width:b.w+'%',height:b.h+'%'});}
function drawOverlays(s,v){
 s=v;
 const layer=$('screenOverlays');layer.replaceChildren();
 if(s.reportHighlights){for(const [i,b] of [{l:7,t:37.1,w:44,h:2.5},{l:7,t:54.6,w:22,h:2.5},{l:7,t:78.8,w:30,h:2.5}].entries()){const mark=document.createElement('span');mark.className='report-marker';mark.setAttribute('aria-hidden','true');setRect(mark,b);mark.style.animationDelay=((.8+i*1.1)/1.1)+'s';layer.append(mark);}}
 if(s.writing){for(const name of ['answer-cover','writing','writing-rest']){const el=document.createElement('div');el.className=name;el.setAttribute('aria-label','필기 예시');layer.append(el);}}
 if(s.writing||s.lessonDone||(s.reviewWriting&&s.reviewState!=='intro')){const clock=document.createElement('span');clock.id='lessonClock';clock.className='lesson-clock';clock.textContent=clockText(s.lessonDone?(lessonElapsed||6):s.reviewWriting?reviewElapsed:lessonElapsed);layer.append(clock);}
 if(s.lessonDone){const pause=document.createElement('div');pause.className='review-pause';pause.textContent='Ⅱ 일시정지';layer.append(pause);}
 if(s.reviewWriting){const review=document.createElement('div');review.className='review-writing '+(s.reviewState==='writing'?'state-writing':s.reviewState);review.setAttribute('aria-label','문제 번호와 오답 체크를 유지하고 가로줄 두 개와 파란 답 3과 2를 쓰는 예시');review.innerHTML=`<svg viewBox="0 0 900 1500" preserveAspectRatio="none" aria-hidden="true"><path class="correction cross-one" pathLength="1" d="M442 393 L503 393"/><path class="correction cross-two" pathLength="1" d="M451 416 L511 418"/><path class="correction cross-three" pathLength="1" d="M462 521 L508 523"/><path class="correction cross-four" pathLength="1" d="M462 545 L519 547"/><path class="answer-three" pathLength="1" d="M550 390 L561 383 L587 381 L601 385 L608 397 L606 407 L578 416 L554 420 L590 420 L604 427 L609 435 L605 443 L595 449 L554 450"/><path class="answer-two" pathLength="1" d="M557 510 L567 503 L580 504 L592 504 L593 513 L594 532 L576 549 L561 561 L612 565"/></svg>`;layer.append(review);if(s.reviewState!=='intro'){const pause=document.createElement('div');pause.className='review-pause';pause.textContent='Ⅱ 일시정지';layer.append(pause);}}
 if(s.scrollSrc){const viewport=document.createElement('div');viewport.className='report-viewport';const img=document.createElement('img');img.src='assets/'+s.scrollSrc;img.alt=s.label;img.className='report-scroll-image'+(s.scrollEnd?' finished':s.scrollStart?' stationary':'');viewport.append(img);layer.append(viewport);}
 if(s.goalLink){const el=document.createElement('span');el.className='goal-link';el.textContent='⚑ 1개월 목표';layer.append(el);}
 for(const it of v.insets||[]){const img=document.createElement('img');img.className='inset'+(it.framed?' framed':'');img.src='assets/'+it.src;img.alt='학습 화면 예시';setRect(img,it);layer.append(img);}
 if(Object.hasOwn(s,'recordState')){const record=document.createElement('span');record.className='record-indicator'+(s.recordState?' active':'');record.setAttribute('aria-label',s.recordState?'녹음 중':'녹음 대기');layer.append(record);}
 for(const b of v.boxes||[]){
  const read=s.mode==='read';const el=document.createElement(read?'div':'button');el.className=(read?'read-highlight':'hotspot')+(s.reviewState==='intro'?' review-target':s.reviewState==='complete'?' review-complete':'');setRect(el,b);
  if(!read){el.type='button';el.setAttribute('aria-label',s.label+' 강조 영역 누르기');el.addEventListener('click',activate);}layer.append(el);
  if(!read&&!s.noFinger){const finger=document.createElement('div');finger.className='finger'+(s.eraserPointer?' eraser-pointer':'')+(s.fingerFlipped?' flipped':'')+(s.reviewState==='intro'?' review-finger':'');const l=Math.min(84,b.l+b.w/2);Object.assign(finger.style,{left:l+'%',top:(s.fingerAbove?b.t-10:Math.min(87,b.t+b.h/2))+'%'});layer.append(finger);}
 }
}
function sentenceText(text){text=text||'';return text.includes('\n')?text:text.replace(/([.!?])\s+(?=\S)/g,'$1\n');}
function copyText(el,text,keepLines=false){
 el.replaceChildren();
 for(const token of (keepLines?text:sentenceText(text)).split(/(\[[^\]]+\])/g)){
  const span=document.createElement('span');span.textContent=token;
  if(token.startsWith('[')&&token.endsWith(']'))span.className='control-name';
  el.append(span);
 }
}
function cloudButton(label,fn,secondary=false){const b=document.createElement('button');b.type='button';b.textContent=label;if(label==='>'){b.innerHTML=nextIcon();b.setAttribute('aria-label','다음 화면');}if(secondary)b.className='secondary';b.addEventListener('click',fn);$('cloudActions').append(b);}
function fade(el,frames,duration=650,delay=0){el.getAnimations().forEach(a=>a.cancel());if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)el.animate(frames,{duration,delay,easing:'ease-in-out',fill:'both'});}
function paintBackground(bg,label,landscape=false,duration=600){
 const img=$('screenImage'),old=$('previousImage'),outgoing=$('previousOverlays');
 if(bg!==lastBackground){old.hidden=!lastBackground;outgoing.hidden=!lastBackground;outgoing.replaceChildren();for(const el of $('screenOverlays').children){if(/(?:^| )(?:review-writing|review-pause|lesson-clock|inset|record-indicator)(?: |$)/.test(el.className)){const copy=el.cloneNode(true);copy.removeAttribute('id');outgoing.append(copy);}}if(lastBackground)fade(outgoing,[{opacity:1},{opacity:0}],duration);if(lastBackground){const scrolled=$('screenOverlays').querySelector('.report-scroll-image');old.src=scrolled?scrolled.src:'assets/'+lastBackground;old.style.objectFit=scrolled?'contain':img.style.objectFit;old.style.height=scrolled?'auto':'100%';old.style.transform=scrolled?getComputedStyle(scrolled).transform:'none';fade(old,[{opacity:1},{opacity:0}],duration);}if(bg)fade(img,[{opacity:0},{opacity:1}],duration);}
 $('landscapeBackdrop').hidden=!landscape;$('landscapeBackdrop').style.backgroundImage=landscape?'url(assets/'+bg+')':'none';img.style.objectFit=landscape?'contain':'fill';$('screen').style.background=landscape?'#BDDFDD':'#FAF8FC';img.hidden=!bg;$('emptyCapture').hidden=!!bg;if(bg){img.src='assets/'+bg;img.alt=label;}else img.removeAttribute('src');lastBackground=bg;
}
function clockText(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function startClock(review=false){const startedAt=Date.now(),initial=review?reviewElapsed:lessonElapsed;const tick=()=>{const seconds=initial+Math.floor((Date.now()-startedAt)/1000);if(review)reviewElapsed=seconds;else lessonElapsed=seconds;$('lessonClock').textContent=clockText(seconds);tickTimer=setTimeout(tick,250);};tick();}
function nextIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5L16 12L9 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function revealWeeklyGuide(){
 writingReady=true;$('nextButton').disabled=false;$('speechWrap').hidden=false;
 $('bubbleArrow').hidden=false;$('speech').setAttribute('aria-disabled','false');
 positionSpeech();fade($('speechWrap'),[{opacity:0},{opacity:1}],750);
}
function fitGuideText(){
 const hero=!$('hero').hidden;
 const guide=hero?$('cloudText'):$('speech'),text=hero?$('cloudText'):$('bubbleText');
 const arrow=hero?document.querySelector('.cloud-forward .cloud-actions button'):$('bubbleArrow');
 if(!hero&&$('speechWrap').hidden)return;
 if(arrow?.dataset.autoHidden==='true'){arrow.hidden=false;delete arrow.dataset.autoHidden;}
 if(text.classList.contains('fixed-lines')){
  const available=guide.clientWidth-parseFloat(getComputedStyle(guide).paddingLeft)-parseFloat(getComputedStyle(guide).paddingRight);
  let font=parseFloat(getComputedStyle(guide).fontSize);
  while(font>10&&text.getBoundingClientRect().width>available){font=Math.max(10,font-.25);guide.style.fontSize=font+'px';}
 }
 if(!arrow||arrow.hidden)return;
 const overlaps=()=>{
  const button=arrow.getBoundingClientRect(),range=document.createRange(),walker=document.createTreeWalker(text,NodeFilter.SHOW_TEXT);
  for(let node=walker.nextNode();node;node=walker.nextNode()){
   range.selectNodeContents(node);
   if([...range.getClientRects()].some(r=>r.width>0&&r.height>0&&r.left<button.right&&r.right>button.left&&r.top<button.bottom&&r.bottom>button.top))return true;
  }
  return false;
 };
 let font=parseFloat(getComputedStyle(guide).fontSize);
 while(font>11&&overlaps()){font=Math.max(11,font-.25);guide.style.fontSize=font+'px';}
 // At the minimum font size, the top navigation and whole speech area still advance.
 if(overlaps()){arrow.hidden=true;arrow.dataset.autoHidden='true';}
}

function positionSpeech(){
 fitGuideText();
 const wrap=$('speechWrap');wrap.style.setProperty('--speech-drop','0px');if(wrap.hidden)return;
 const shift=wrap.getBoundingClientRect().top-$('appScene').getBoundingClientRect().top-wrap.offsetTop;
 const guides=[$('speech'),wrap.querySelector('.mascot-peek')].map(el=>{const b=el.getBoundingClientRect();return {...b.toJSON(),top:b.top-shift,bottom:b.bottom-shift};});let drop=0;
 for(const target of $('screenOverlays').querySelectorAll('.hotspot')){const box=target.getBoundingClientRect();for(const guide of guides)if(box.left<guide.right&&box.right>guide.left&&box.top<guide.bottom&&box.bottom>guide.top)drop=Math.max(drop,box.bottom+12-guide.top);}
 wrap.style.setProperty('--speech-drop',drop+'px');
}
function render(){
 clearTimeout(tickTimer);
 if(TutorialIntro.render(current(),$('appScene'),()=>go(current().next)))return;
 const s=current(),v=visual(s),hero=['title','hero','choice','end'].includes(v.type),touch=(v.boxes||[]).length>0&&v.mode!=='read';
 $('appScene').dataset.state=s.id+(s.phases?'-'+(phase+1):'');$('sceneTitle').textContent=s.type==='title'?'':s.label;
 $('progress').textContent=s.type==='end'?'완료':`PART ${s.part}/2`;
 $('scope').hidden=!s.scope;$('scope').textContent=s.scope||'';$('timeTag').hidden=!s.timeLabel;$('timeTag').textContent=s.timeLabel||'';
 $('hero').hidden=!hero;$('appScene').hidden=false;$('speechWrap').hidden=hero||!v.bubble;
 $('speech').className='speech'+(v.recordGuide?' record-guide':'')+(v.twoLine?' two-line':'')+(['S21','S08'].includes(s.id)?' two-line-map':'');
 $('status').textContent=!hero&&!s.bg?'이미지 준비 중':s.audio&&!s.audioSrc?'음원 파일 준비 중':s.example?'학습 예시 화면':'';
 $('prevButton').disabled=!history.length;$('nextButton').setAttribute('aria-label',s.type==='end'?'다시 보기':s.type==='title'?'시작하기':'다음');
 $('nextButton').disabled=s.type==='choice';writingReady=!(s.writing||v.reviewState==='writing'||v.autoScroll||v.guideAfterHighlights);
 if(hero){
  $('heroCharacter').hidden=!!s.completionBackdrop;document.querySelector('.cloud').className='cloud'+(s.type==='hero'?' cloud-forward':'')+(v.twoLine?' two-line':'');paintBackground(s.bg||'screen-map-home-kimkyowon.png',s.completionBackdrop?'학습 안내 완료 배경':s.bg?s.label+' 앱 화면':'스마트구몬N 홈 화면',s.landscape);$('screenOverlays').replaceChildren();
  $('cloudText').style.removeProperty('font-size');copyText($('cloudText'),s.bubble);$('cloudActions').replaceChildren();
  if(s.type==='choice')for(const choice of s.choices)cloudButton(choice.label,()=>go(nextTarget(s,choice.target)),choice.label==='건너뛰기');
  else if(s.type==='title')cloudButton('체험 시작',advance);
  else if(s.type==='end'){cloudButton('다시 체험하기',restart);cloudButton('목차 보기',()=>$('menuDialog').showModal(),true);}
  else cloudButton('>',advance);
 }else{
  paintBackground(v.bg||s.bg||null,s.label+' 앱 화면',v.landscape);
  drawOverlays(s,s.id==='S14'?{...v,recordState:recording}:v);
  $('speech').style.removeProperty('font-size');$('speechWrap').hidden=!v.bubble||!!v.guideAfterHighlights;$('bubbleText').classList.toggle('fixed-lines',!!v.fixedLines);copyText($('bubbleText'),v.bubble,!!v.fixedLines);
  if(s.id==='mapTopic')$('bubbleText').innerHTML='2A 21~30에서는 가타카나의\n<strong>ナ</strong>(나)·<strong>ハ(하)</strong>행을 배우는군요.';
  if(v.note){const note=document.createElement('small');note.className='bubble-note';note.textContent=v.note;$('bubbleText').append(note);}
  const clickable=!touch&&writingReady;$('bubbleArrow').hidden=!clickable;
  $('speech').setAttribute('aria-disabled',String(!clickable));$('speech').setAttribute('aria-label',(v.bubble||'')+(clickable?' 다음 화면으로 이동':''));
  $('nextButton').disabled=!writingReady;
  if(s.writing){$('status').textContent='교재 풀이 예시';startClock();lessonTimer=setTimeout(()=>{writingReady=true;go(s.next);},6200);}
  
  if(v.guideAfterHighlights)lessonTimer=setTimeout(revealWeeklyGuide,HIGHLIGHT_MS);
  if(v.reviewState==='writing')startClock(true);
  if(v.reviewState==='writing'||v.autoScroll){$('status').textContent=v.autoScroll?'화면을 살펴보고 있어요.':'';lessonTimer=setTimeout(()=>{writingReady=true;phase++;render();},v.autoScroll?SCROLL_MS:4400);}
 }
 positionSpeech();
 fade(hero?$('hero'):$('speechWrap'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],750,v.revealAfterTransition?600:0);
 if(!hero&&v.revealAfterTransition)fade($('screenOverlays'),[{opacity:0},{opacity:1}],500,600);else $('screenOverlays').getAnimations().forEach(a=>a.cancel());
}
$('bubbleArrow').addEventListener('click',e=>{e.stopPropagation();advance();});
$('speech').addEventListener('click',()=>{if($('speech').getAttribute('aria-disabled')==='false')advance();});
document.querySelector('.cloud').addEventListener('click',e=>{if(current().type==='hero'&&!e.target.closest('button'))advance();});
$('prevButton').addEventListener('click',previous);$('nextButton').addEventListener('click',advance);
$('menuButton').addEventListener('click',()=>$('menuDialog').showModal());
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
for(const [start,label,id=start] of CHAPTERS){
 const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.scene=id;b.addEventListener('click',()=>{$('menuDialog').close();go(id);});$('chapters').append(b);
}
const previousImage=document.createElement('img');previousImage.id='previousImage';previousImage.className='screen-image previous-image';previousImage.alt='';previousImage.hidden=true;$('screen').append(previousImage);
const previousOverlays=document.createElement('div');previousOverlays.id='previousOverlays';previousOverlays.className='previous-overlays';previousOverlays.setAttribute('aria-hidden','true');previousOverlays.hidden=true;$('screen').append(previousOverlays);
const nextDay=document.createElement('div');nextDay.id='nextDay';nextDay.className='next-day';nextDay.textContent='다음 날 오후 3시 이후';nextDay.hidden=true;$('screen').append(nextDay);
for(const bg of new Set(PLAN.flatMap(s=>[s.bg,...(s.slides||[]),...(s.phases||[]).flatMap(v=>[v.bg,v.scrollSrc,...(v.slides||[])])]).filter(Boolean))){const img=new Image();img.src='assets/'+bg;}
render();
const speechLayout=new ResizeObserver(positionSpeech);speechLayout.observe($('speech'));speechLayout.observe(document.querySelector('.tablet'));
window.addEventListener('resize',()=>{$('speech').style.removeProperty('font-size');$('cloudText').style.removeProperty('font-size');positionSpeech();});
document.fonts.ready.then(positionSpeech);
</script>
