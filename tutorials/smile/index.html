function fingerPlacement(b,frame,ceiling,side=false){const width=frame.width*.15,height=width*108/94;if(side)return {left:(b.l+b.w/2)/100*frame.width-height*.92-10,top:(b.t+b.h/2)/100*frame.height-height*.5+width*.14,flip:1,turn:90};const x=Math.max(4,Math.min(frame.width-width-4,(b.l+b.w/2)/100*frame.width-width*.36));const below=(b.t+b.h)/100*frame.height+6-height*.08;const flip=frame.top+below+height+4>ceiling;return {left:x,top:flip?b.t/100*frame.height-6-height*.92:below,flip:flip?-1:1};}
function target(s){$('targets').replaceChildren();for(const original of s.boxes||[]){const b=visibleBox(s,original);const el=document.createElement(s.read?'div':'button');el.className=s.read?'highlight':'hotspot';Object.assign(el.style,{left:b.l+'%',top:b.t+'%',width:b.w+'%',height:b.h+'%'});if(!s.read){el.setAttribute('aria-label',s.label+' 강조 영역 누르기');el.addEventListener('click',advance);const finger=document.createElement('span');finger.className='finger';const point=s.fingerAt?visibleBox(s,{l:s.fingerAt.l-4,t:s.fingerAt.t-2,w:8,h:4}):b;const frame=$('capture').getBoundingClientRect(),guide=$('guide').getBoundingClientRect();const ceiling=Math.min($('screen').getBoundingClientRect().bottom,guide.top-(point.l<26?82:0)-6);const placement=fingerPlacement(point,frame,ceiling,!!s.fingerAt);finger.style.left=placement.left+'px';finger.style.top=placement.top+'px';finger.style.setProperty('--flip',placement.flip);finger.style.setProperty('--turn',(placement.turn||0)+'deg');$('targets').append(finger);} $('targets').append(el);}}
function liftAmount(s){const screen=$('screen').getBoundingClientRect(),guide=$('guide').getBoundingClientRect();if(!s.boxes?.length||s.read||s.lift===false)return 0;const bottom=Math.max(...s.boxes.map(original=>{const b=visibleBox(s,original);return (b.t+b.h)/100;}));const gap=s.boxes.some(b=>b.l/100*screen.width<90)?100:60;return Math.max(0,screen.top+screen.height*bottom-(guide.top-gap));}
function moveCapture(amount){$('capture').style.transform=`translateY(${-amount}px)`;}
async function render(){const token=++version,s=current();if(TutorialIntro.render(s,$('frame'),()=>go(s.next))){pending=false;return;}pending=true;$('frame').dataset.state=s.id;$('prev').disabled=!history.length;$('next').disabled=true;$('progress').textContent=s.type==='end'?'완료':`PART ${s.part}/3`;$('day').hidden=s.type!=='day';$('guide').className='guide'+(['start','end'].includes(s.type)?' hero':'')+(s.id==='BREAK1'?' middle-forward':'');$('guide').hidden=s.type==='day';$('targets').replaceChildren();$('actions').replaceChildren();copyText(s);fitCopy(s);$('status').textContent='';
 sizeScreen(s);const previous=$('image').getAttribute('src');const src='assets/'+s.bg;if(previous!==src){$('old').hidden=!previous;if(previous){captureImage($('old'),previous.slice(7));fade($('old'),[{opacity:1},{opacity:0}]);} captureImage($('image'),s.bg);fade($('image'),[{opacity:0},{opacity:1}]);} $('image').alt=s.label+' 앱 화면';moveCapture(0);
 const clickable=!(s.boxes?.length&&!s.read)||s.bubbleAdvance;$('bubble').setAttribute('aria-disabled',String(!clickable));$('forward').hidden=!clickable||['start','end'].includes(s.type);if(s.type==='start')action('체험 시작',()=>go('A01'));if(s.type==='end'){action('다시 안내받기',restart);action('목차 보기',()=>$('menuDialog').showModal(),true);}layoutGuide(s);
 if(s.type==='day'){fade($('day'),[{opacity:0},{opacity:1}]);await pause(1800);if(token!==version)return;fade($('day'),[{opacity:1},{opacity:0}]);await pause(600);if(token===version)go(s.next);return;}
 fade($('guide'),[{opacity:0},{opacity:1}],650);lifted=liftAmount(s);if(lifted>0){await pause(350);if(token!==version)return;moveCapture(lifted);await pause(650);if(token!==version)return;}else await pause(600);if(token!==version)return;target(s);fade($('targets'),[{opacity:0},{opacity:1}],550);pending=false;$('next').disabled=false;
}
function action(text,fn,secondary=false){const b=document.createElement('button');b.type='button';b.textContent=text;if(secondary)b.className='secondary';b.addEventListener('click',fn);$('actions').append(b);}
function go(id,back=false){const next=PLAN.findIndex(s=>s.id===id);if(next<0)return;if(!back)history.push(index);index=next;render();}
async function advance(){if(pending)return;const s=current();if(s.type==='end'){restart();return;}if(lifted>0){pending=true;$('next').disabled=true;const token=version;fade($('targets'),[{opacity:1},{opacity:0}],300);fade($('guide'),[{opacity:1},{opacity:0}],300);await pause(300);if(token!==version)return;moveCapture(0);await pause(650);if(token!==version)return;}go(s.next);}
function previous(){++version;if(history.length){index=history.pop();while(PLAN[index].type==='day'&&history.length)index=history.pop();render();}}
function restart(){++version;index=0;history=[];render();}
$('forward').addEventListener('click',e=>{e.stopPropagation();advance();});$('prev').addEventListener('click',previous);$('next').addEventListener('click',advance);$('bubble').addEventListener('click',e=>{if(!e.target.closest('button')&&$('bubble').getAttribute('aria-disabled')==='false')advance();});$('bubble').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===$('bubble')){e.preventDefault();if($('bubble').getAttribute('aria-disabled')==='false')advance();}});$('menu').addEventListener('click',()=>$('menuDialog').showModal());document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));for(const [id,label] of CHAPTERS){const b=document.createElement('button');b.textContent=label;b.addEventListener('click',()=>{$('menuDialog').close();go(id);});$('chapters').append(b);}window.addEventListener('resize',()=>{if(!pending){layoutGuide(current());moveCapture(0);lifted=liftAmount(current());moveCapture(lifted);target(current());}});for(const bg of new Set(PLAN.map(s=>s.bg))){const img=new Image();img.src='assets/'+bg;}document.fonts.ready.then(()=>{if(!pending){layoutGuide(current());moveCapture(0);lifted=liftAmount(current());moveCapture(lifted);target(current());}});render();
