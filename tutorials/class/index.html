<script type="application/json" id="screen-plan">[{"id": "title", "row": 7, "label": "화상수업 입장 방법", "bg": "home.png", "chapter": 1, "bubble": "스마트구몬 WINGS, 첫 수업 전에\n화상수업 방법을 함께 알아볼까요?", "type": "title", "next": "check", "fixedLines": true}, {"id": "check", "row": 8, "label": "수업 전 확인", "bg": "home.png", "chapter": 1, "bubble": "원활한 화상 수업을 위해\n수업 전에 두 가지만 확인해 주세요.\n① 스마트구몬N 학습 앱이 최신 버전인지\n② 와이파이 속도가 원활한지", "type": "screen", "mode": "read", "next": "wifi-entry", "fixedLines": false, "fixedIntro": true}, {"id": "wifi-entry", "row": 9, "label": "와이파이 속도 확인 방법", "bg": "wifi-entry.png", "chapter": 1, "bubble": "Wifi 속도 확인 방법을 알려드릴게요.\n인터넷 창을 열고 주소에 fast.com을 입력해주세요.", "type": "screen", "boxes": [{"l": 11.5, "t": 4.2, "w": 77, "h": 5.5}], "callout": "fast.com 입력", "addressZoom": true, "fingerAt": {"l": 81, "t": 10, "angle": 0}, "next": "wifi-result", "fixedLines": true}, {"id": "wifi-result", "row": 10, "label": "와이파이 속도 확인", "bg": "wifi-result.png", "chapter": 1, "bubble": "접속하면 자동으로 속도를 확인해 줘요.\n50~100Mbps 정도면 원활한 학습이 가능해요.", "type": "screen", "mode": "read", "note": "※ 와이파이는 공유기에 가까울수록 속도가 빨라져요.", "next": "C01", "fixedLines": false}, {"id": "C01", "row": 11, "label": "홈 메뉴 열기", "bg": "home.png", "chapter": 2, "bubble": "학습앱에서 오른쪽 위 [목록(삼선)]버튼을 눌러주세요.", "type": "screen", "boxes": [{"l": 93, "t": 1.1, "w": 5.5, "h": 3.4}], "fingerAt": {"l": 84, "t": 5.5, "angle": 35}, "next": "C02", "fixedLines": true}, {"id": "C02", "row": 12, "label": "스마트클래스 선택", "bg": "menu.png", "chapter": 2, "bubble": "메뉴에서 [스마트클래스]를 선택해주세요.", "type": "screen", "boxes": [{"l": 5, "t": 50.5, "w": 34, "h": 5.5}], "next": "C04", "fixedLines": true}, {"id": "C04", "row": 13, "label": "수업 일정 확인", "bg": "scheduled.png", "chapter": 2, "bubble": "수업이 있는 요일을 선택하면 예정된 수업 일정을\n확인할 수 있어요. 아직 수업 준비 중인 경우,\n[수업 예정]으로 나타나요.", "type": "screen", "mode": "read", "next": "refresh", "fixedLines": false}, {"id": "refresh", "row": 14, "label": "수업 목록 새로고침", "bg": "scheduled.png", "chapter": 2, "bubble": "클래스가 보이지 않거나 [수업 예정]으로\n남아 있다면, [새로고침] 버튼을 눌러 주세요.", "type": "screen", "boxes": [{"l": 90.5, "t": 58, "w": 6, "h": 3.8}], "next": "C05", "fixedLines": false}, {"id": "C05", "row": 15, "label": "선생님이 수업을 연 뒤 입장", "bg": "entry.png", "chapter": 2, "bubble": "수업 준비가 완료되면 [입장]으로 바뀌어요.\n[입장]버튼을 누르면 수업에 입장할 수 있어요.", "type": "screen", "boxes": [{"l": 75, "t": 65.2, "w": 20, "h": 4.8}], "fingerAbove": true, "next": "C06", "fixedLines": false}, {"id": "C06", "row": 16, "label": "선생님 연결", "bg": "class-main.png", "chapter": 3, "bubble": "수업 입장이 완료되었어요.\n선생님과 즐거운 수업 시작!", "type": "screen", "mode": "read", "bubbleDelay": 1000, "next": "C07", "fixedLines": false}, {"id": "C07", "row": 17, "label": "수업 종료", "bg": "completed.png", "chapter": 3, "bubble": "수업이 끝나면 [수업완료]로 바뀌어요. 수업완료\n버튼을 클릭하면, 수업 내용을 간략히 확인할 수 있어요.", "type": "screen", "mode": "read", "next": "end", "fixedLines": true}, {"id": "end", "row": 18, "label": "안내 완료", "bg": "home.png", "chapter": 3, "bubble": "화상 수업 준비도 완료! 선생님과의\n즐거운 첫 수업 되시길 바랄게요~!", "type": "end", "next": null, "fixedLines": true}]</script><script>'use strict';
const PLAN=JSON.parse(document.getElementById('screen-plan').textContent);
const $=id=>document.getElementById(id);
let index=0,history=[],lastBackground=null;
function current(){return PLAN[index];}
function reduceMotion(){return matchMedia('(prefers-reduced-motion: reduce)').matches;}
function fade(el,frames,duration=650,delay=0){
 el.getAnimations().forEach(a=>a.cancel());
 if(!reduceMotion())el.animate(frames,{duration,delay,easing:'ease-in-out',fill:'both'});
}
function go(id){
 const next=PLAN.findIndex(s=>s.id===id);if(next<0)return;
 history.push(index);index=next;render();
}
function advance(){if(current().type==='end')restart();else if(current().next)go(current().next);}
function previous(){if(history.length){index=history.pop();render();}}
function restart(){index=0;history=[];render();}
function rect(el,b){Object.assign(el.style,{left:b.l+'%',top:b.t+'%',width:b.w+'%',height:b.h+'%'});}
function paintBackground(s){
 const img=$('screenImage'),old=$('previousImage');
 if(s.bg!==lastBackground){
  old.hidden=!lastBackground;
  if(lastBackground){old.src='assets/'+lastBackground;fade(old,[{opacity:1},{opacity:0}],600);}
  fade(img,[{opacity:0},{opacity:1}],600);
 }
 img.src='assets/'+s.bg;img.alt=s.label+' 예시 화면';img.hidden=false;
 $('emptyCapture').hidden=true;lastBackground=s.bg;
}
function overlays(s){
 const layer=$('screenOverlays');layer.getAnimations().forEach(a=>a.cancel());layer.replaceChildren();
 if(s.addressZoom){const zoom=document.createElementNS('http://www.w3.org/2000/svg','svg');zoom.setAttribute('viewBox','200 77 545 54');zoom.classList.add('address-zoom');const image=document.createElementNS('http://www.w3.org/2000/svg','image');image.setAttribute('href','assets/'+s.bg);image.setAttribute('width','992');image.setAttribute('height','1586');zoom.append(image);layer.append(zoom);}
 if(s.callout){const tip=document.createElement('div');tip.className='browser-callout';tip.textContent=s.callout;layer.append(tip);}
 for(const b of s.boxes||[]){
  const read=s.mode==='read',target=document.createElement(read?'div':'button');
  target.className=read?'read-highlight':'hotspot';rect(target,b);
  if(!read){target.type='button';target.setAttribute('aria-label',s.label+' 강조 영역 누르기');target.addEventListener('click',advance);}
  layer.append(target);
  if(!read){
   const hand=document.createElement('div');hand.className='finger';hand.setAttribute('aria-hidden','true');
   const below=b.t+b.h+1,above=b.t-11;
   const at=s.fingerAt||{l:Math.min(85,Math.max(0,b.l+b.w/2-4.4)),t:s.fingerAbove?Math.max(0,above):below,angle:s.fingerAbove?180:0};
   Object.assign(hand.style,{left:at.l+'%',top:at.t+'%'});hand.style.setProperty('--finger-angle',(at.angle||0)+'deg');
   const image=document.createElement('img');image.src='assets/onstudy-img_hand.png';image.alt='';hand.append(image);layer.append(hand);
  }
 }
 if(s.addressZoom)fade(layer,[{opacity:0},{opacity:1}],350,600);
}
function cloudButton(label,fn,secondary=false){
 const button=document.createElement('button');button.type='button';button.textContent=label;
 if(secondary)button.className='secondary';button.addEventListener('click',fn);$('cloudActions').append(button);
}
function renderBubble(s){
 const text=$('bubbleText');text.replaceChildren();let cursor=0;
 if(s.id==='check'){
  const lines=s.bubble.split('\n'),intro=document.createElement('span');intro.className='prep-check-intro';intro.textContent=lines.slice(0,2).join('\n');text.append(intro);
  for(const line of lines.slice(2)){text.append('\n');const item=document.createElement('span');item.className='prep-check-item';item.textContent=line;text.append(item);}return;
 }
 for(const match of s.bubble.matchAll(/\[([^\]]+)\]|fast\.com|50~100Mbps/g)){
  text.append(s.bubble.slice(cursor,match.index));cursor=match.index+match[0].length;
  const span=document.createElement('span');
  if(!match[1]){span.className='bubble-accent';span.textContent=match[0];}
  else{
   span.className='control-name';
   if(match[1]==='목록(삼선)'){span.append('[목록');const small=document.createElement('span');small.className='control-note';small.textContent='(삼선)';span.append(small,']');}
   else span.textContent=match[0];
  }
  text.append(span);
 }
 text.append(s.bubble.slice(cursor));
}
function fitSpeechText(){
 if(!$('hero').hidden){
  const text=$('cloudText');if(!text.classList.contains('fixed-lines'))return;
  const available=document.querySelector('.cloud-content').clientWidth;let font=parseFloat(getComputedStyle(text).fontSize);
  while(font>10&&text.scrollWidth>available+.5){font=Math.max(10,font-.25);text.style.fontSize=font+'px';}return;
 }
 const speech=$('speech'),text=$('bubbleText'),arrow=$('bubbleArrow');
 if($('speechWrap').hidden)return;
 if(arrow.dataset.autoHidden==='true'){arrow.hidden=false;delete arrow.dataset.autoHidden;}
 const available=speech.clientWidth-parseFloat(getComputedStyle(speech).paddingLeft)-parseFloat(getComputedStyle(speech).paddingRight);
 const fixed=speech.classList.contains('fixed-lines')?text:text.querySelector('.prep-check-intro');
 if(fixed){let font=parseFloat(getComputedStyle(speech).fontSize);while(font>10&&fixed.getBoundingClientRect().width>available){font=Math.max(10,font-.25);speech.style.fontSize=font+'px';}}
 if(arrow.hidden)return;
 const overlaps=()=>{const button=arrow.getBoundingClientRect(),range=document.createRange(),walker=document.createTreeWalker(text,NodeFilter.SHOW_TEXT);while(walker.nextNode()){range.selectNodeContents(walker.currentNode);if([...range.getClientRects()].some(r=>r.width&&r.height&&r.left<button.right&&r.right>button.left&&r.top<button.bottom&&r.bottom>button.top))return true;}return false;};
 let font=parseFloat(getComputedStyle(speech).fontSize);while(font>11&&overlaps()){font=Math.max(11,font-.25);speech.style.fontSize=font+'px';}
 if(overlaps()){arrow.hidden=true;arrow.dataset.autoHidden='true';}
}

function positionSpeech(){
 fitSpeechText();
 const wrap=$('speechWrap');wrap.style.setProperty('--speech-drop','0px');if(wrap.hidden)return;
 const shift=wrap.getBoundingClientRect().top-$('appScene').getBoundingClientRect().top-wrap.offsetTop;
 const guides=[$('speech'),wrap.querySelector('.mascot-peek')].map(el=>{const b=el.getBoundingClientRect();return {...b.toJSON(),top:b.top-shift,bottom:b.bottom-shift};});let drop=0;
 for(const target of $('screenOverlays').querySelectorAll('.hotspot,.read-highlight')){
  const box=target.getBoundingClientRect();
  for(const guide of guides)if(box.left<guide.right&&box.right>guide.left&&box.top<guide.bottom&&box.bottom>guide.top)drop=Math.max(drop,box.bottom+12-guide.top);
 }
 wrap.style.setProperty('--speech-drop',drop+'px');
}
function render(){
 const s=current(),hero=s.type==='title'||s.type==='end',touch=(s.boxes||[]).length>0&&s.mode!=='read';
 $('appScene').dataset.state=s.id;$('sceneTitle').textContent=s.label;$('progress').textContent=s.type==='end'?'완료':`PART ${s.chapter}/3`;
 $('scope').hidden=true;$('timeTag').hidden=true;$('status').textContent='';
 $('prevButton').disabled=!history.length;
 $('nextButton').setAttribute('aria-label',s.type==='end'?'다시 보기':s.type==='title'?'시작하기':'다음');
 $('hero').hidden=!hero;$('speechWrap').hidden=hero;
 paintBackground(s);
 if(hero){
  $('screenOverlays').replaceChildren();$('heroCharacter').hidden=false;
  document.querySelector('.cloud').className='cloud';$('cloudText').style.removeProperty('font-size');$('cloudText').classList.toggle('fixed-lines',!!s.fixedLines);$('cloudText').textContent=s.bubble;$('cloudActions').replaceChildren();
  if(s.type==='title')cloudButton('시작하기',advance);
  else cloudButton('다시 보기',restart);
 }else{
  overlays(s);$('speech').style.removeProperty('font-size');$('speech').className='speech'+(['C04','C05','C07','wifi-entry'].includes(s.id)?' two-line':'')+(s.fixedLines?' fixed-lines':'');renderBubble(s);$('speech').setAttribute('aria-disabled',String(touch));
  if(s.note){const note=document.createElement('small');note.className='bubble-note';note.textContent=s.note;$('bubbleText').append(note);}
  $('bubbleArrow').hidden=touch;
 }
 positionSpeech();fade(hero?$('hero'):$('speechWrap'),[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],750,s.bubbleDelay||0);
}
$('bubbleArrow').addEventListener('click',e=>{e.stopPropagation();advance();});
$('speech').addEventListener('click',e=>{if(!e.target.closest('button')&&$('speech').getAttribute('aria-disabled')==='false')advance();});
$('speech').addEventListener('keydown',e=>{if(e.target===$('speech')&&(e.key==='Enter'||e.key===' ')&&$('speech').getAttribute('aria-disabled')==='false'){e.preventDefault();advance();}});
$('prevButton').addEventListener('click',previous);$('nextButton').addEventListener('click',advance);
const old=document.createElement('img');old.id='previousImage';old.className='screen-image previous-image';old.alt='';old.hidden=true;$('screen').append(old);
for(const bg of new Set(PLAN.map(s=>s.bg))){const image=new Image();image.src='assets/'+bg;}
render();
const layoutObserver=new ResizeObserver(positionSpeech);layoutObserver.observe($('speech'));layoutObserver.observe(document.querySelector('.tablet'));
window.addEventListener('resize',()=>{$('speech').style.removeProperty('font-size');$('cloudText').style.removeProperty('font-size');positionSpeech();});
document.fonts.ready.then(()=>{$('speech').style.removeProperty('font-size');$('cloudText').style.removeProperty('font-size');positionSpeech();});
</script></body></html>
